name: project_b
description: Privacy-first location timeline and calendar. Working name Project B.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Keep Drift and its generator on the same release: drift_dev 2.34.0 is
# incompatible with drift 2.34.4 despite accepting it in its version range.
dependencies:
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
